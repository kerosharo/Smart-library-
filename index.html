<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>المكتبة الذكية</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--wood:#4a2c17;--wood2:#6b4023;--gold:#e8c987;--paper:#f1e2bd;--ink:#3a2412;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:#2b180c;color:var(--ink);font-family:'Amiri','Noto Naskh Arabic',Tahoma,serif;overflow:hidden}
#app{display:flex;height:100%}
aside{width:230px;background:linear-gradient(#5a3519,#3b2110);border-left:3px solid #2a1608;padding:12px;display:flex;flex-direction:column;gap:6px;color:var(--gold)}
.logo{text-align:center;font-size:24px;padding:14px 0;border-bottom:1px solid #8a5a32;margin-bottom:6px}
.logo span{display:block;font-size:44px}
aside button.nav{background:none;border:0;border-bottom:1px solid #6b4426;color:var(--gold);font:inherit;font-size:19px;text-align:right;padding:12px 8px;cursor:pointer}
aside button.nav.on{background:#7a4a26;border-radius:6px}
aside input{width:100%;padding:9px;border-radius:20px;border:2px solid #8a5a32;background:#3a2210;color:var(--gold);font:inherit}
main{flex:1;overflow-y:auto;padding:14px;background:radial-gradient(#6b4023,#3b2110)}
.scroll{background:var(--paper);border-radius:14px;border:3px solid #b98b4e;padding:14px;margin-bottom:14px;box-shadow:inset 0 0 40px #c9a56a}
h2{margin:0 0 10px;font-size:22px}
.ribbon{text-align:center;font-size:30px;color:var(--gold);background:linear-gradient(#7a4a26,#4a2c17);border:3px solid #b98b4e;border-radius:8px;padding:6px;margin-bottom:12px}
.row{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;padding:4px}
.book{flex:0 0 120px;scroll-snap-align:start;cursor:pointer;text-align:center;position:relative}
.cov{height:165px;border-radius:4px 8px 8px 4px;background:linear-gradient(135deg,#7a4a26,#3b2110);color:var(--gold);display:flex;align-items:center;justify-content:center;padding:8px;font-size:15px;box-shadow:3px 4px 8px #0006;background-size:cover;background-position:center}
.book small{display:block;margin-top:5px;font-size:13px;line-height:1.3}
.book .mn{position:absolute;top:4px;left:4px;background:#000a;color:#fff;border:0;border-radius:50%;width:26px;height:26px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:16px}
.grid .book{flex:none}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.cat{background:linear-gradient(#8a5a32,#5a3519);border:2px solid #3b2110;border-radius:8px;color:var(--gold);padding:12px;cursor:pointer;font-size:19px}
.cat.on{outline:3px solid var(--gold)}
.cat small{display:block;opacity:.8;font-size:14px}
.btn{background:linear-gradient(#8a5a32,#5a3519);color:var(--gold);border:2px solid #3b2110;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer;font-size:16px}
.edit{display:flex;gap:6px;margin:6px 0;flex-wrap:wrap}
.edit input{flex:1;min-width:110px;padding:7px;border-radius:6px;border:1px solid #8a5a32;background:#fff8e6;font:inherit}
#reader{position:fixed;inset:0;background:#d9c79c;display:none;flex-direction:column;z-index:10;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#reader.open{display:flex}
.bar{display:flex;gap:6px;align-items:center;padding:8px;background:linear-gradient(#6b4023,#4a2c17);color:var(--gold);flex-wrap:wrap}
.bar .t{flex:1;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:80px}
.bar select,.bar input[type=number]{background:#3a2210;color:var(--gold);border:1px solid #8a5a32;border-radius:6px;padding:5px;font:inherit;max-width:150px}
.bar input[type=number]{width:60px}
#view{flex:1;overflow:hidden;text-align:center;padding:10px;touch-action:none;position:relative}
#view{touch-action:none;overscroll-behavior:none;position:relative;overflow:hidden}#view canvas{display:block;margin:0 auto;max-width:none}#view.zoomed{scroll-behavior:auto}#view.swiping{cursor:grabbing}#view canvas{box-shadow:0 2px 12px #0008;background:#fff}
#txt{max-width:760px;margin:auto;background:var(--paper);padding:22px;text-align:start;font-size:22px;line-height:2;border-radius:8px}#txt img{max-width:100%;height:auto}#reader.night #view{background:#111}#reader.night #txt{background:#1c1c1c;color:#ddd}#reader.night canvas{filter:invert(1) hue-rotate(180deg)}
#bars{position:absolute;top:0;bottom:0;left:0;right:auto;width:min(440px,92vw);overflow-y:auto;z-index:6;background-color:rgba(74,44,23,.96);background-image:radial-gradient(ellipse at 20% 10%,rgba(255,220,160,.10),transparent 34%),repeating-linear-gradient(173deg,rgba(255,235,190,.045) 0px,rgba(255,235,190,.045) 2px,rgba(50,25,8,.035) 3px,rgba(50,25,8,.035) 9px),repeating-linear-gradient(86deg,transparent 0px,transparent 45px,rgba(255,220,170,.035) 47px,transparent 51px);background-blend-mode:screen,normal,normal;padding-top:env(safe-area-inset-top,0px);transition:transform .35s cubic-bezier(.2,.8,.2,1);box-shadow:4px 0 18px #0008;backdrop-filter:blur(8px)}#bars.hide{transform:translateX(-105%)}#hd{position:absolute;left:6px;top:50%;z-index:7;opacity:.9;padding:6px 10px}#tocEdgeBtn{position:absolute;right:6px;top:50%;z-index:7;opacity:.9;padding:6px 10px}#toc{position:absolute;top:0;bottom:0;right:0;width:min(340px,88%);background-color:rgba(43,24,12,.96);background-image:repeating-linear-gradient(174deg,rgba(255,220,170,.035) 0px,rgba(255,220,170,.035) 2px,transparent 3px,transparent 11px);color:var(--gold);transform:translateX(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);z-index:5;overflow-y:auto;padding:12px;box-shadow:-6px 0 20px #000a;padding-top:calc(12px + env(safe-area-inset-top,0px));backdrop-filter:blur(8px)}#view.page-turn-next{animation:turnNext .32s ease}#view.page-turn-prev{animation:turnPrev .32s ease}@keyframes turnNext{0%{transform:perspective(900px) rotateY(-3deg);filter:brightness(.9)}100%{transform:none;filter:none}}@keyframes turnPrev{0%{transform:perspective(900px) rotateY(3deg);filter:brightness(.9)}100%{transform:none;filter:none}}.opacity-control{display:flex;align-items:center;gap:8px;padding:4px 10px;color:var(--gold);font-size:14px}.opacity-control input{width:100px}
#toc.open{transform:none}
#toc div{padding:10px;border-bottom:1px solid #5a3519;cursor:pointer}
#toc div:hover{background:#5a3519}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 18px;border-radius:20px;display:none;z-index:20;max-width:90%;text-align:center}
@media(max-width:700px){#app{flex-direction:column}aside{width:100%;flex-direction:row;flex-wrap:wrap;padding:6px}.logo{display:none}aside input{flex:1 0 100%}}

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const $=s=>document.querySelector(s);
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',4000)};
// ---------- storage ----------
const dbp=new Promise((res,rej)=>{const r=indexedDB.open('smartlib',1);r.onupgradeneeded=()=>r.result.createObjectStore('books',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=async(m,f)=>{const d=await dbp;return new Promise((res,rej)=>{const s=d.transaction('books',m).objectStore('books');const r=f(s);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})};
let books=[],mem=null;
const defCats=[{id:'h',name:'تاريخ',kw:'تاريخ,حضارة,history'},{id:'a',name:'الأدب والشعر',kw:'ديوان,شعر,أدب,literature'},{id:'n',name:'الروايات',kw:'رواية,novel'},{id:'r',name:'الدين',kw:'دين,فقه,قرآن,تفسير,حديث,islam'},{id:'s',name:'العلوم',kw:'علوم,فيزياء,كيمياء,طب,صيدلة,science,pharm'},{id:'p',name:'الفلسفة',kw:'فلسفة,منطق,philosophy'},{id:'u',name:'غير مصنف',kw:''}];
let cats=(()=>{try{return JSON.parse(localStorage.getItem('cats'))||defCats}catch(e){return defCats}})();
const saveCats=()=>{try{localStorage.setItem('cats',JSON.stringify(cats))}catch(e){}};
const guess=n=>{n=n.toLowerCase();for(const c of cats)if(c.kw&&c.kw.split(/[,،]/).some(k=>k.trim()&&n.includes(k.trim().toLowerCase())))return c.id;return(cats.find(c=>c.id==='u')||cats[cats.length-1]).id};
// ---------- import ----------
async function cover(file){try{const p=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;const pg=await p.getPage(1);const v=pg.getViewport({scale:1});const s=200/v.width;const c=document.createElement('canvas');const vp=pg.getViewport({scale:s});c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;return c.toDataURL('image/jpeg',.7)}catch(e){return null}}
async function importFiles(list){let n=0;for(const f of list){const ext=f.name.split('.').pop().toLowerCase();if(!['pdf','epub','txt','md','html'].includes(ext))continue;const name=f.name.replace(/\.[^.]+$/,'');if(books.some(b=>b.name===name&&b.size===f.size))continue;toast('جاري إضافة: '+name);const b={id:Date.now()+Math.random(),name,type:ext,size:f.size,blob:f,cat:guess(name),cover:ext==='pdf'?await cover(f):ext==='epub'?await epubCover(f):null,added:Date.now()};try{await tx('readwrite',s=>s.put(b))}catch(e){}books.push(b);n++}toast(n?`تمت إضافة ${n} كتاب`:'لا توجد كتب جديدة');render()}
$('#add').onclick=()=>$('#f1').click();$('#addf').onclick=()=>$('#f2').click();
$('#f1').onchange=e=>importFiles([...e.target.files]);$('#f2').onchange=e=>importFiles([...e.target.files]);
// ---------- views ----------
let view='home',cur=null,query='';
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{view=b.dataset.v;cur=null;document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('on',x===b));render()});
$('#q').oninput=e=>{query=e.target.value.trim();render()};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bookHtml=b=>`<div class="book" data-id="${b.id}"><div class="cov" ${b.cover?`style="background-image:url(${b.cover})"`:''}>${b.cover?'':esc(b.name)}</div><small>${esc(b.name)}</small><button class="mn" data-m="${b.id}">⋮</button></div>`;
function render(){const m=$('#main');let h='';
const shown=books.filter(b=>(!cur||b.cat===cur)&&(!query||b.name.toLowerCase().includes(query.toLowerCase())));
if(view==='cats'){h+=`<div class="ribbon">إدارة الأقسام</div><div class="scroll">`+cats.map(c=>`<div class="edit"><input value="${esc(c.name)}" data-n="${c.id}"><input value="${esc(c.kw)}" data-k="${c.id}" placeholder="كلمات مفتاحية للتصنيف التلقائي"><button class="btn" data-d="${c.id}">🗑</button></div>`).join('')+`<button class="btn" id="nc">➕ قسم جديد</button> <button class="btn" id="rc">🔄 إعادة التصنيف التلقائي</button></div>`}
else{if(view==='home'&&!query&&!cur&&books.length)h+=`<div class="ribbon">اكتشف الجديد</div><div class="scroll"><div class="row">${[...books].sort((a,b)=>b.added-a.added).slice(0,12).map(bookHtml).join('')}</div></div>`;
h+=`<div class="scroll"><h2>الفهرس والتصنيفات</h2><div class="cats">`+cats.map(c=>`<div class="cat ${cur===c.id?'on':''}" data-c="${c.id}">${esc(c.name)}<small>${books.filter(b=>b.cat===c.id).length} كتاب</small></div>`).join('')+`</div></div>`;
h+=`<div class="scroll"><h2>${cur?esc(cats.find(c=>c.id===cur).name):'كل الكتب'}</h2>${shown.length?`<div class="grid">${shown.map(bookHtml).join('')}</div>`:'<p>لا توجد كتب هنا. اضغط «إضافة كتب» أو «إضافة مجلد كامل» لتجميع كتب جهازك (PDF / TXT / HTML).</p>'}</div>`}
m.innerHTML=h;
m.querySelectorAll('[data-c]').forEach(e=>e.onclick=()=>{cur=cur===e.dataset.c?null:e.dataset.c;render()});
m.querySelectorAll('.book').forEach(e=>e.onclick=ev=>{if(ev.target.dataset.m)return;openBook(books.find(b=>b.id==e.dataset.id))});
m.querySelectorAll('[data-m]').forEach(e=>e.onclick=()=>bookMenu(books.find(b=>b.id==e.dataset.m)));
m.querySelectorAll('[data-n]').forEach(e=>e.onchange=()=>{cats.find(c=>c.id===e.dataset.n).name=e.value;saveCats()});
m.querySelectorAll('[data-k]').forEach(e=>e.onchange=()=>{cats.find(c=>c.id===e.dataset.k).kw=e.value;saveCats()});
m.querySelectorAll('[data-d]').forEach(e=>e.onclick=()=>{if(cats.length<2)return;const id=e.dataset.d;cats=cats.filter(c=>c.id!==id);books.filter(b=>b.cat===id).forEach(b=>{b.cat=cats[cats.length-1].id;tx('readwrite',s=>s.put(b))});saveCats();render()});
const nc=$('#nc');if(nc)nc.onclick=()=>{cats.unshift({id:'c'+Date.now(),name:'قسم جديد',kw:''});saveCats();render()};
const rc=$('#rc');if(rc)rc.onclick=()=>{books.forEach(b=>{b.cat=guess(b.name);tx('readwrite',s=>s.put(b))});toast('تمت إعادة التصنيف');render()};}
function bookMenu(b){const names=cats.map((c,i)=>`${i+1}) ${c.name}`).join('\n');const a=prompt(`نقل «${b.name}» إلى قسم (اكتب الرقم)\nأو اكتب 0 للحذف:\n${names}`);if(a===null)return;const n=parseInt(a);if(n===0){tx('readwrite',s=>s.delete(b.id));books=books.filter(x=>x!==b)}else if(cats[n-1]){b.cat=cats[n-1].id;tx('readwrite',s=>s.put(b))}render()}
// ---------- reader ----------
let pdf=null,pages=null,page=1,total=0,speaking=false,tok=0,outline=[];
async function openBook(b){speechStop();$('#reader').classList.add('open');$('#rt').textContent=b.name;$('#toc').classList.remove('open');$('#view').innerHTML='جاري التحميل…';pdf=null;pages=null;outline=[];
try{if(b.type==='pdf'){pdf=await pdfjsLib.getDocument({data:await b.blob.arrayBuffer()}).promise;total=pdf.numPages;const o=await pdf.getOutline();outline=o?flat(o,0):[];if(!outline.length)outline=await detectPdfToc(pdf,total);if(!outline.length){const d0=pdf;setTimeout(()=>scanHeadings(d0,total),50)}}
else if(b.type==='epub'){const r=await parseEpub(b.blob);pages=r.chapters;total=pages.length;outline=r.toc.length?r.toc:pages.map((c,i)=>({title:'القسم '+(i+1),page:i+1,d:0}))}else{let t=await b.blob.text();if(b.type==='html')t=new DOMParser().parseFromString(t,'text/html').body.innerText;pages=[];for(let i=0;i<t.length;){let e=Math.min(i+2500,t.length);const k=t.indexOf('\n',e);if(k>-1&&k-e<400)e=k;pages.push(t.slice(i,e));i=e}total=pages.length;outline=pages.flatMap((p,i)=>p.split('\n').filter(isHead).map(l=>({title:l.trim().slice(0,70),page:i+1,d:0})))}}catch(e){$('#view').textContent='تعذر فتح الكتاب';return}
$('#pg').max=total;buildToc();curBook=b;go(getPos(b.id));if(pdf){const d1=pdf;setTimeout(async()=>{if(loadManualToc(d1))return;await refineToc(d1);maybeOcrToc(d1)},1500)}}
function flat(items,d){let r=[];for(const it of items){r.push({title:it.title,dest:it.dest,d});if(it.items&&it.items.length)r=r.concat(flat(it.items,d+1))}return r}
async function detectPdfToc(doc,count){
  // Read the opening pages because many scanned/exported books have a visible TOC but no PDF outline.
  const limit=Math.min(count,14);let tocText='',tocPhysical=1;
  for(let n=1;n<=limit;n++){
    try{const pg=await doc.getPage(n);const tc=await pg.getTextContent();const text=tc.items.map(x=>x.str).join(' ').replace(/\s+/g,' ');
      if(/فهرس|المحتويات|الموضوعات|table of contents|contents/i.test(text)&&text.length>80){tocText=text;tocPhysical=n;break;}}
    catch(e){}
  }
  if(!tocText)return [];
  // Rebuild lines from text items by their vertical coordinates; parse dotted leaders or trailing page numbers.
  let pg;try{pg=await doc.getPage(tocPhysical)}catch(e){return []}
  const tc=await pg.getTextContent();const lines=[];
  for(const it of tc.items){if(!it.str||!it.str.trim())continue;const y=Math.round((it.transform?.[5]||0)/3)*3;let line=lines.find(x=>Math.abs(x.y-y)<=4);if(!line){line={y,text:it.str};lines.push(line)}else line.text+=' '+it.str;}
  lines.sort((a,b)=>b.y-a.y);
  const parsed=[];
  for(const row of lines){let z=row.text.replace(/\s+/g,' ').trim();if(!z||/^(الفهرس|المحتويات|الموضوعات|contents|table of contents)$/i.test(z))continue;
    let m=z.match(/(.{2,100}?)\s*(?:\.{2,}|…+|ـ{2,}|\s{2,})\s*(\d{1,4})\s*$/);
    if(!m)m=z.match(/^(.{2,90}?)\s+(\d{1,4})\s*$/);
    if(!m)continue;let title=m[1].replace(/[. …ـ\-–—]+$/,'').trim(),printed=+m[2];
    if(title.length<2||printed<1||/^(صفحة|page)$/i.test(title))continue;
    parsed.push({title,printed,d:0});
  }
  const unique=[];const seen=new Set();for(const x of parsed){const k=x.title.toLowerCase();if(!seen.has(k)){seen.add(k);unique.push(x)}}
  if(!unique.length)return [];
  // Match headings against actual page text so front matter and Roman numerals don't shift destinations.
  const scanLimit=Math.min(count,Math.max(80,tocPhysical+unique.length*3));const texts=[];
  for(let n=1;n<=scanLimit;n++){try{const pgx=await doc.getPage(n);const tx=(await pgx.getTextContent()).items.map(i=>i.str).join(' ').replace(/\s+/g,' ').toLowerCase();texts.push(tx)}catch(e){texts.push('')}}
  return unique.map(o=>{const needle=o.title.toLowerCase().replace(/[^\p{L}\p{N}]+/gu,' ').trim();let found=0;
    if(needle.length>=4){for(let i=tocPhysical;i<texts.length;i++){const hay=texts[i].replace(/[^\p{L}\p{N}]+/gu,' ');if(hay.includes(needle)){found=i+1;break}}}
    return {title:o.title,page:found||Math.min(count,o.printed),d:0};
  }).filter(x=>x.page>0);
}
function buildToc(){const t=$('#toc');t.innerHTML='<h2>فهرس الكتاب</h2>'+(outline.length?'':'<p>لا يحتوي الكتاب على فهرس مدمج — يمكنك التنقل بالصفحات.</p>')+outline.map((o,i)=>`<div data-i="${i}" style="padding-right:${10+o.d*16}px">${esc(o.title)}</div>`).join('');t.querySelectorAll('[data-i]').forEach(e=>e.onclick=async()=>{const o=outline[e.dataset.i];let p=o.page;if(!p&&pdf&&o.dest){try{const d=typeof o.dest==='string'?await pdf.getDestination(o.dest):o.dest;p=(await pdf.getPageIndex(d[0]))+1}catch(x){}}if(p){t.classList.remove('open');speechStop();go(p)}})}
$('#tocb').onclick=()=>$('#toc').classList.toggle('open');
async function go(n){n=Math.max(1,Math.min(total,n));page=n;const my=++tok;$('#pg').value=n;$('#pc').textContent='/ '+total;const v=$('#view');
if(pdf){const pg=await pdf.getPage(n);const w=Math.min(v.clientWidth-20,900);const base=pg.getViewport({scale:1});const sc=w/base.width,dpr=window.devicePixelRatio||1;const vp=pg.getViewport({scale:sc*dpr});const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;c.style.width=vp.width/dpr+'px';await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;if(my!==tok)return;v.innerHTML='';v.appendChild(c);v._c=c}
else{v.innerHTML='<div id="txt"></div>';$('#txt').textContent=pages[n-1]}
v.scrollTop=0}
$('#nx').onclick=()=>{speechStop();go(page+1)};$('#pv').onclick=()=>{speechStop();go(page-1)};$('#pg').onchange=e=>{speechStop();go(+e.target.value)};
$('#x').onclick=()=>{speechStop();$('#reader').classList.remove('open')};
// ---------- read aloud ----------
const synth=window.speechSynthesis;
function loadVoices(){const vs=synth.getVoices().sort((a,b)=>(b.lang.startsWith('ar')-a.lang.startsWith('ar'))||a.lang.localeCompare(b.lang));$('#voice').innerHTML=vs.map((v,i)=>`<option value="${v.name}">${v.name} (${v.lang})</option>`).join('')||'<option>لا توجد أصوات</option>'}
if(synth){loadVoices();synth.onvoiceschanged=loadVoices}
function speechStop(){speaking=false;if(synth)synth.cancel();$('#play').textContent='🔊 اقرأ'}
async function pageText(n){if(pages)return pages[n-1];const pg=await pdf.getPage(n);const tc=await pg.getTextContent();return tc.items.map(i=>i.str).join(' ').replace(/\s+/g,' ').trim()}
async function ocr(){toast('الصفحة مصورة — جاري التعرف على النص (OCR)…');try{await new Promise((res,rej)=>{if(window.Tesseract)return res();const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)});const w=await Tesseract.createWorker('ara+eng');const c=$('#view')._c;const r=await w.recognize(c);await w.terminate();return r.data.text}catch(e){return ''}}
async function readPage(){
  if(!speaking)return;
  let t=await pageText(page);
  if(!t||t.length<15)t=await ocr();
  if(!speaking)return;
  t=cleanArabicText(t);
  if(!t||t.length<5){
    toast('تعذر استخراج نص هذه الصفحة.');
    if(page<total){await go(page+1);return readPage()}

async function digitWorker(){if(digW)return digW;const w=await Tesseract.createWorker('ara');try{await w.setParameters({tessedit_char_whitelist:'٠١٢٣٤٥٦٧٨٩0123456789',tessedit_pageseg_mode:'7'})}catch(e){}digW=w;return w}
async function ocrTocRows(doc,n,st){
 const f=await ocrFull(doc,n);const c=f.cv;if(!c)return{rows:[],text:f.text};
 const W=c.width,H=c.height,img=c.getContext('2d',{willReadFrequently:true}).getImageData(0,0,W,H).data;
 const ink=(x,y)=>{const i=(y*W+x)*4;return img[i]*.3+img[i+1]*.59+img[i+2]*.11<150};
 const isT=w=>{const s=w.t.trim();if(!s||/^([مهي]{3,}|[مهـ.…·:\-–—|]+)$/.test(s))return false;return(s.match(/[\u0621-\u064A\u0671-\u06D3]/g)||[]).length>=1||(s.match(/[A-Za-z]/g)||[]).length>=3};
 const ws=f.words.filter(isT).sort((a,b)=>(a.y0+a.y1)-(b.y0+b.y1));const hs=ws.map(w=>w.y1-w.y0).sort((a,b)=>a-b),mh=hs.length?hs[hs.length>>1]:30;
 const rows=[];for(const w of ws){const y=(w.y0+w.y1)/2,r=rows[rows.length-1];if(r&&Math.abs(r.y-y)<=mh*.6){r.ws.push(w);r.y=(r.y*(r.ws.length-1)+y)/r.ws.length}else rows.push({y,ws:[w]})}
 const dw=await digitWorker(),out=[];let k=0;
 for(const r of rows){k++;if(st)st(`قراءة أرقام الصفحات… ${k}/${rows.length}`);
  const title=r.ws.slice().sort((a,b)=>b.x1-a.x1).map(w=>w.t.trim()).join(' ').replace(/\s+/g,' ').trim();
  if((title.match(/\p{L}/gu)||[]).length<2||/^(الفهرس|فهرس|المحتويات)$/.test(title))continue;
  const y0=Math.max(0,Math.floor(Math.min(...r.ws.map(w=>w.y0))-3)),y1=Math.min(H-1,Math.ceil(Math.max(...r.ws.map(w=>w.y1))+3)),h=y1-y0,xl=Math.min(W,Math.floor(Math.min(...r.ws.map(w=>w.x0))));
  const mn=[],mx=[],tall=[];for(let x=0;x<xl;x++){let a=-1,b=-1;for(let y=y0;y<=y1;y++)if(ink(x,y)){if(a<0)a=y;b=y}mn[x]=a;mx[x]=b;tall[x]=a>=0&&(b-a)>=h*.35}
  let xs=-1,xe=-1;for(let x=0;x<xl;x++){if(tall[x]){if(xs<0){xs=x;xe=x}else if(x-xe<=h*.9)xe=x;else break}}
  const edge=Math.max(...r.ws.map(w=>w.x1));let cands=[];
  if(xs>=0){let cy0=1e9,cy1=-1;for(let x=xs;x<=xe;x++)if(mn[x]>=0){cy0=Math.min(cy0,mn[x]);cy1=Math.max(cy1,mx[x])}
   const cw=xe-xs+1,ch=cy1-cy0+1;if(ch>4&&cw>2){const sc=60/ch,sub=document.createElement('canvas');sub.width=Math.ceil(cw*sc)+40;sub.height=Math.ceil(ch*sc)+40;const sx=sub.getContext('2d');sx.fillStyle='#fff';sx.fillRect(0,0,sub.width,sub.height);sx.drawImage(c,xs,cy0,cw,ch,20,20,cw*sc,ch*sc);
    try{const rr=await dw.recognize(sub);const t=dig(rr.data.text||'').replace(/\D/g,'');if(t){const a=+t,b=+t.split('').reverse().join('');cands=[a,b]}}catch(e){}}}
  if(!cands.length){if(out.length&&r.y-out[out.length-1].y<mh*2.2){out[out.length-1].title+=' '+title}continue}
  out.push({title,cands,edge,y:r.y,ocr:1,rtl:true,W})}
 let prev=0;const res=[];for(const o of out){const cs=[...new Set(o.cands)].filter(x=>x>0&&x<=3000);if(!cs.length)continue;let pick=cs.filter(x=>x>=prev).sort((a,b)=>a-b)[0];if(pick==null)pick=Math.max(...cs);o.printed=pick;prev=pick;res.push(o)}
 return{rows:res,text:f.text}}

 hi:{n:'الهندية',tts:['hi'],tess:'hin',cls:'ind'},zh:{n:'الصينية',tts:['zh','cmn'],tess:'chi_sim',cls:'cjk'},ja:{n:'اليابانية',tts:['ja'],tess:'jpn',cls:'cjk'},ko:{n:'الكورية',tts:['ko'],tess:'kor',cls:'cjk'}};
let bookLang='ar',pageRtl=true,langBook=null,langDone=false,ocrKey='';
const vMatch=v=>{const l=(v.lang||'').toLowerCase().replace('_','-');return LANGS[bookLang].tts.some(p=>l===p||l.startsWith(p+'-'))};
function pickVoice(){const vs=synth?synth.getVoices():[];const sel=$('#voice').value;return vs.find(v=>v.name===sel&&vMatch(v))||vs.find(vMatch)||null}

async function getOcrW(){const l=LANGS[bookLang]||LANGS.ar;const langs=[...new Set([l.tess,'eng'])],key=langs.join('+');if(ocrW&&ocrKey===key)return ocrW;try{if(ocrW)await ocrW.terminate()}catch(e){}ocrW=await Tesseract.createWorker(langs);ocrKey=key;return ocrW}
loadVoices=function(){if(!synth)return;const vs=synth.getVoices().slice().sort((a,b)=>(vMatch(b)-vMatch(a))||(a.lang||'').localeCompare(b.lang||''));const sel=$('#voice');
 sel.innerHTML=vs.map(v=>`<option value="${esc(v.name)}">${esc(v.name)} (${esc(v.lang)})</option>`).join('')||'<option>لا توجد أصوات</option>';
 const saved=ls('voice_'+bookLang),ok=vs.find(v=>v.name===saved&&vMatch(v))||vs.find(vMatch);if(ok)sel.value=ok.name};
if(synth)synth.onvoiceschanged=loadVoices;
$('#voice').addEventListener('change',e=>ls('voice_'+bookLang,e.target.value));
function detectLang(text){text=String(text||'').slice(0,8000);const c=re=>(text.match(re)||[]).length;
 const ar=c(/[\u0600-\u06FF]/g),he=c(/[\u0590-\u05FF]/g),cy=c(/[\u0400-\u04FF]/g),el=c(/[\u0370-\u03FF]/g),han=c(/[\u4E00-\u9FFF]/g),kana=c(/[\u3040-\u30FF]/g),hang=c(/[\uAC00-\uD7AF]/g),dev=c(/[\u0900-\u097F]/g),lat=c(/[A-Za-z\u00C0-\u017F]/g);
 const mx=Math.max(ar,he,cy,el,han+kana,hang,dev,lat);if(mx<120)return null;
 if(mx===ar){if(c(/[پچژگ]/g)>3)return'fa';if(c(/[ٹڈڑںے]/g)>3)return'ur';return'ar'}
 if(mx===he)return'he';if(mx===cy)return'ru';if(mx===el)return'el';if(mx===han+kana)return kana>(han+kana)*.1?'ja':'zh';if(mx===hang)return'ko';if(mx===dev)return'hi';
 const W={en:'the and of to in is that it was for with as on be this are by not'.split(' '),fr:'le la les des et est que une pour dans pas qui sur au du'.split(' '),es:'el la los las de que y en un una por con para es del se'.split(' '),
  de:'der die das und ist nicht ein eine mit den von zu auf für dem'.split(' '),it:'il lo gli che di e un una per con non sono della del le'.split(' '),pt:'os as que de não um uma para com em do da é se'.split(' '),tr:'ve bir bu için ile da de çok olarak gibi daha'.split(' ')};
 const toks=text.toLowerCase().match(/[a-zà-ÿçğışöüñ]+/g)||[];const sc={};for(const k in W){const s=new Set(W[k]);sc[k]=toks.reduce((a,t)=>a+(s.has(t)?1:0),0)}
 let best='en',bv=-1;for(const k in sc)if(sc[k]>bv){bv=sc[k];best=k}return best}
function applyLang(code){if(!LANGS[code])code='ar';const L=LANGS[code],prevKey=ocrKey;bookLang=code;pageRtl=!!L.rtl;
 const cls=L.cls;$('#ff').innerHTML=cls==='ar'?FA_AR:FONTS[cls].map(f=>`<option value="${f[0].replace(/"/g,'&quot;')}">${f[1]}</option>`).join('');
 const saved=ls('ff_'+cls);const opts=[...$('#ff').options].map(o=>o.value);ffam=opts.includes(saved)?saved:opts[0];$('#ff').value=ffam;const t=$('#txt');if(t)t.style.fontFamily=ffam;
 $('#view').lang=code;const sel=$('#lang');if(sel&&sel.dataset.auto!=='0')sel.title='اللغة المكتشفة: '+L.n;loadVoices();
 $('#pv').onclick=()=>{speechStop();go(page+(pageRtl?-1:1))};$('#nx').onclick=()=>{speechStop();go(page+(pageRtl?1:-1))}}

 s.onchange=()=>{const id=curBook&&curBook.id;if(!id)return;const v=s.value;if(v==='auto'){ls('lang'+id,'');langDone=false;langBook=null;autoLang()}else{ls('lang'+id,v);langDone=true;langBook=id;applyLang(v)}clearOcrCaches();if($('#reader').classList.contains('open'))go(page)}})();

async function sampleText(){let t='';if(textMode&&$('#txt'))t=$('#txt').textContent||'';
 if(t.length<150&&pdf){try{if((await smartBlocks(page))==='bad')return t}catch(e){}
  for(const n of [page,Math.min(total,page+1),Math.min(total,page+2),Math.min(total,Math.max(3,Math.round(total/3)))]){try{const pg=await pdf.getPage(n);t+=' '+(await pg.getTextContent()).items.map(i=>i.str).join(' ')}catch(e){}if(t.length>800)break}}
